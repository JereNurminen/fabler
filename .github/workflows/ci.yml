name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck (player, creation-tool, reader)
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  rust:
    name: Rust (test / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The types-freshness check below runs the index generator, so this job
      # needs node as well as cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Tauri 2 links against the system webkit stack.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      # Regenerates types/ from scratch via `yarn codegen` (delete, cargo
      # test export_bindings, rebuild the index) rather than relying on the
      # Test step above to have already produced fresh bindings, so this
      # check is order-independent. This is what catches an orphaned file
      # left behind when a #[derive(TS)] is removed from a Rust type.
      - name: Types are up to date
        run: |
          yarn codegen
          git diff --exit-code types/
          if [ -n "$(git status --porcelain types/)" ]; then
            echo "Untracked or removed files under types/ — run 'yarn codegen' and commit the result."
            git status --porcelain types/
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
