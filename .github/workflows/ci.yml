name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck (player, creation-tool, reader)
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  rust:
    name: Rust (test / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The types-freshness check below runs the index generator, so this job
      # needs node as well as cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Tauri 2 links against the system webkit stack.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      # The Test step above already regenerated the ts-rs bindings (its
      # export_bindings_* tests write into types/src/ as a side effect), so
      # this step only needs to regenerate the index and diff. This step
      # must stay after Test — if the job is reordered or split so that
      # Test no longer runs first, this check will silently pass over stale
      # bindings.
      - name: Types are up to date
        run: |
          node types/generate-index.mjs
          git diff --exit-code types/

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
